<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to do list</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>To-do list</h1>
        <p id="subtexto">Quais são as tarefas de hoje?</p>
        <input type="text" id="tarefa" placeholder="digite...">
        <div class="botoes">
            <button type="submit" id="enviar" onclick="adicionarTarefa()">adicionar!</button>
            <button type="submit" id="botao_lista" onclick="limparLista()">limpar lista</button>
        <div>
        <p id="mensagem"></p>
        <ul id="listatarefas"></ul>
    </div> 

    <script src="script.js"></script>
</body>
</html>
